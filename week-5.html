<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="dist/reset.css">

  <link rel="stylesheet" href="dist/theme/codexitos.css">
  <link rel="stylesheet" href="dist/print/pdf.css">
</head>
<body>
<div class="reveal">
  <div class="slides">

    <!-- TITLE SLIDE ─────────────────────────────── -->
    <section class="cx-title"
             data-background-image="dist/theme/codexitos-assets/image1.jpeg"
             data-background-size="cover"
             data-markdown>
      <textarea data-template>
# Airmax Connect Phase 2 - Core Platform Build
## Weekly Review 05 - Mar 27th
<p class="cx-date">March 2026</p>
      </textarea>
    </section>

    <!-- SECTION DIVIDER ─────────────────────────── -->
    <section class="cx-divider"
             data-background-image="dist/theme/codexitos-assets/image5.jpeg"
             data-background-size="cover"
             data-markdown>
      <textarea data-template>
## Phase 2 Roadmap (12 Weeks)
      </textarea>
    </section>

    <!-- CONTENT: Roadmap ──────────────── -->
    <section class="cx-content">
  <h2>Phase 2 Roadmap (12 Weeks)</h2>

  <div style="display:flex; gap:20px; margin-top:40px; align-items:stretch;">

    <div style="flex:1; background:#f7f7f7; border-radius:16px; padding:20px; border-top:6px solid #66bb6a;">
      <div style="font-size:28px; font-weight:700; color:#1f2a44;">Weeks 1–4</div>
      <div style="margin-top:10px; font-size:20px; color:#333;">Foundation &amp; Cloud Infrastructure Setup</div>
      <div style="margin-top:20px; font-size:42px;">✅</div>
    </div>

    <div style="flex:1; background:#fff8e1; border-radius:16px; padding:20px; border-top:6px solid #f9a825; box-shadow:0 0 18px rgba(249,168,37,0.25);">
      <div style="font-size:18px; color:#f9a825; font-weight:700; margin-bottom:8px;">Now in Progress</div>
      <div style="font-size:28px; font-weight:700; color:#1f2a44;">Weeks 5–8</div>
      <div style="margin-top:10px; font-size:20px; color:#333;">Feature Development &amp; Integration</div>
      <div style="margin-top:20px; font-size:42px;">🔄</div>
    </div>

    <div style="flex:1; background:#f7f7f7; border-radius:16px; padding:20px; border-top:6px solid #fbc02d;">
      <div style="font-size:28px; font-weight:700; color:#1f2a44;">Weeks 9–11</div>
      <div style="margin-top:10px; font-size:20px; color:#333;">Stabilization, User Testing &amp; Refinement</div>
      <div style="margin-top:20px; font-size:42px;">🛡️</div>
    </div>

    <div style="flex:1; background:#f7f7f7; border-radius:16px; padding:20px; border-top:6px solid #fbc02d;">
      <div style="font-size:28px; font-weight:700; color:#1f2a44;">Week 12</div>
      <div style="margin-top:10px; font-size:20px; color:#333;">Pilot Validation &amp; Go-Live Readiness</div>
      <div style="margin-top:20px; font-size:42px;">📋</div>
    </div>

  </div>
</section>

    <!-- CONTENT: Weekly Progress ─────────────────────── -->
    <section class="cx-content" data-markdown>
      <textarea data-template>
## Week 5 Progress – Enabling Operational Behavior

- Improved navigation by scoping users to their branch, making operations more focused
- Enabled configuration and manual control of device outputs, allowing each installation to define and adjust equipment behavior as needed
- Added visibility into configuration status, making it clear when changes are successfully applied
- Introduced telemetry monitoring to track device performance over time
- Introduced scheduling capabilities, allowing equipment to run automatically at the right times
        </textarea>
    </section>
    <!-- SECTION DIVIDER ─────────────────────────── -->
    <section class="cx-divider"
             data-background-image="dist/theme/codexitos-assets/image5.jpeg"
             data-background-size="cover"
             data-markdown>
      <textarea data-template>
        ## Demo

Capabilities implemented during Week 5
      </textarea>
    </section>



    <!-- CONTENT: Next Steps ──────────────────────── -->
    <section class="cx-content" data-markdown>
      <textarea data-template>
## Next Steps – Weeks 6 & 7

- Introduce alerts to quickly identify issues and understand their severity
- Introduce automatic safety shutoff to protect equipment during critical conditions
- Enable service call management to track and document work in the field
- Link alerts to service actions to ensure issues are properly resolved and followed through 

      </textarea>
    </section>

    <!-- CLOSING SLIDE ───────────────────────────── -->
    <section class="cx-title"
             data-background-image="dist/theme/codexitos-assets/image1.jpeg"
             data-background-size="cover"
             data-markdown>
      <textarea data-template>
# Thank You
## Q&A
<p class="cx-date">Airmax Connect</p>
      </textarea>
    </section>

  </div><!-- /.slides -->
</div><!-- /.reveal -->

<div class="cx-footer">
  <span class="cx-page"></span>
  <span> | Brilliant Minds in the Digital World</span>
</div>

<script src="dist/reveal.js"></script>
<script src="plugin/markdown/markdown.js"></script>
<script>
  Reveal.initialize({
    hash: true,
    width: 1280,
    height: 720,
    margin: 0,
    minScale: 0.2,
    maxScale: 2.0,
    transition: 'fade',
    transitionSpeed: 'fast',
    controls: true,
    progress: true,
    slideNumber: false,
    plugins: [ RevealMarkdown ]
  });

  Reveal.on('ready', function () {
    document.querySelectorAll('.reveal .slides section').forEach(function (section) {
      if (!section.querySelector('.cx-logo')) {
        var logo = document.createElement('div');
        logo.className = 'cx-logo';
        section.appendChild(logo);
      }
    });
    updateFooter();
  });

  function updateFooter() {
    var current      = Reveal.getSlidePastCount() + 1;
    var currentSlide = Reveal.getCurrentSlide();
    var footer       = document.querySelector('.cx-footer');

    if (currentSlide && currentSlide.classList.contains('cx-title')) {
      footer.style.opacity = '0';
    } else {
      footer.style.opacity = '1';
      document.querySelector('.cx-footer .cx-page').textContent =
        String(current).padStart(2, '0');
    }
  }

  Reveal.on('slidechanged', updateFooter);
</script>
</body>
</html>
